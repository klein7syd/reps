name: 构建与回归

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 构建
        run: python3 build.py

      - name: 回归测试
        run: python3 test/regress.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: reps-single-file
          path: dist/index.html
          retention-days: 30

      - name: 记录产物指纹
        run: |
          echo "### 构建产物" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 字节 | $(wc -c < dist/index.html) |" >> $GITHUB_STEP_SUMMARY
          echo "| md5 | \`$(md5sum dist/index.html | cut -d' ' -f1)\` |" >> $GITHUB_STEP_SUMMARY
